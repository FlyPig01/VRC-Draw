name: Windows CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MinGW Release
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset mingw-release

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset mingw-release --parallel 2

      - name: Test
        shell: msys2 {0}
        run: ctest --preset mingw-release

      - name: Create portable package
        shell: pwsh
        run: |
          $projectLine = Select-String -Path "CMakeLists.txt" -Pattern 'project\([^\r\n]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          if ($projectLine.Matches.Count -ne 1) {
            throw "无法从 CMakeLists.txt 读取项目版本。"
          }
          $version = $projectLine.Matches[0].Groups[1].Value
          $archiveName = "VRC-Draw-v$version-win64.zip"
          $archive = "build/$archiveName"
          $package = "build/package/VRC-Draw"
          New-Item -ItemType Directory -Path "$package/data/logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package/data/temp" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package/exports" -Force | Out-Null
          Copy-Item "build/mingw-release/portable/VRC-Draw/VRC-Draw.exe" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Copy-Item "THIRD_PARTY_NOTICES.md" $package
          Compress-Archive -Path $package -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content "$archive.sha256" -Encoding ascii
          "PACKAGE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_CHECKSUM=$archive.sha256" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_ARTIFACT=VRC-Draw-v$version-win64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            ${{ env.PACKAGE_ARCHIVE }}
            ${{ env.PACKAGE_CHECKSUM }}
          if-no-files-found: error
          retention-days: 14
