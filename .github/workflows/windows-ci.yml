name: Windows CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MinGW Release
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset mingw-release

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset mingw-release --parallel 2

      - name: Test
        shell: msys2 {0}
        run: ctest --preset mingw-release

      - name: Create portable package
        shell: pwsh
        run: |
          $package = "build/package/VRC-Draw"
          New-Item -ItemType Directory -Path "$package/data/logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package/data/temp" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package/exports" -Force | Out-Null
          Copy-Item "build/mingw-release/portable/VRC-Draw/VRC-Draw.exe" $package
          Copy-Item "README.md" $package
          Copy-Item "LICENSE" $package
          Copy-Item "THIRD_PARTY_NOTICES.md" $package
          Compress-Archive -Path $package -DestinationPath "build/VRC-Draw-win64.zip"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Draw-win64
          path: build/VRC-Draw-win64.zip
          if-no-files-found: error
          retention-days: 14
