name: 功能建议
description: 提议一个符合项目范围的新功能或改进
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        MVP 优先保证轻量、简单和可停止。涉及画布标定、多颜色、游戏进程访问或规避检测的建议不属于当前项目范围。

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述使用中遇到的问题，而不只是给出实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的交互、输入和输出。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不要求读取或修改 VRChat 进程、内存、网络或客户端文件。
          required: true
        - label: 该建议不用于隐藏自动化、规避检测或绕过限制。
          required: true
        - label: 我理解功能是否符合 VRChat 规则仍需单独确认。
          required: true

